
name: Compilar The End Update Bosses

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip -q *.zip -d projeto

      - name: Compilar mod
        run: |
          cd projeto
          gradle build --no-daemon

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: The-End-Update-Bosses
          path: projeto/build/libs/*.jar
